services:
  - type: web
    name: agri-optimizer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT
    healthCheckPath: /
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: LANG
        value: "en_US.UTF-8"
      - key: LC_ALL
        value: "en_US.UTF-8"
